<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1 class="titulo">FORMULARIO SENA V1</h1>
  <h4 class="titulo2">GRACIAS POR DEJAR SUS DATOS</h4>

  <div class="contenedor-formulario">
    <form class="formulario" id="survey-form">

      <label>Name:</label>
      <input type="text" name="Nombre" >

      <label>Email:</label>
      <input type="email" name="correo">

      <label>Age:</label>
      <input type="number" name="Edad">

      <label>Choose on option:</label>
      <select name="ubicacion" >
      <option value="" disabled selected>Selecciona una opción</option>
      <option value="bogota">Bogotá</option>
      <option value="medellin">Medellín</option>
      <option value="cali">Cali</option>
      <option value="barranquilla">Barranquilla</option>
      <option value="otra">Otra ciudad</option>
      </select>

      <label>Do you plan to buy a new car in the next 5 years?</label>
      <div class="grupo-opciones">
        <label><input type="radio" name="compra-carro" value="Yes"> Yes</label>
        <label><input type="radio" name="compra-carro" value="No"> No</label>
        <label><input type="radio" name="compra-carro" value="Maybe"> Maybe</label>
      </div>

      <label for="marca-carro">What is your favorite car brand?</label>
      <select id="marca-carro" name="marca-carro" >
        <option value="" disabled selected>Select One Option</option>
        <option value="toyota">Toyota</option>
        <option value="chevrolet">Chevrolet</option>
        <option value="mazda">Mazda</option>
        <option value="otra">Otra</option>
      </select>

      <label>What type of means of transportation do you own?</label>
      <div class="grupo-opciones">
        <label><input type="checkbox" name="transporte" value="car"> Car</label>
        <label><input type="checkbox" name="transporte" value="barco"> Boat</label>
        <label><input type="checkbox" name="transporte" value="bicicleta"> Bicycle</label>
        <label><input type="checkbox" name="transporte" value="moto"> Motorcycle</label>
        <label><input type="checkbox" name="transporte" value="avion"> Plane</label>
        <label><input type="checkbox" name="transporte" value="avion"> Bike</label>

      </div>

      <label for="comentarios">Any comments suggestions?</label>
      <textarea id="comentarios" name="comentarios" placeholder="Please enter your comments"></textarea>

      <button type="submit" id="submit" value="submit">Submit</button>

    </form >
    <div id="modal-success" class="modal hidden">
        <div class="modal-content">
            <h2>Datos enviados con exito</h2>
            <button type="button" id="close-modal">CERRAR</button>
        </div>
    </div>
  </div>
  
    <script type="module" src="main.js"></script>
</body>
</html>
